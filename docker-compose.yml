version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: pdf_worker_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pdf_worker_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web UI
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  flaky-pdf:
    build:
      context: .
      dockerfile: docker/Dockerfile.chaos
    container_name: pdf_worker_chaos
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - FAILURE_RATE=0.7
      - MIN_LATENCY_MS=50
      - MAX_LATENCY_MS=200
      - LOG_LEVEL=info

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: pdf_worker_api
    restart: unless-stopped
    command: npm run dev:api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - LOG_LEVEL=info
      - LOG_PRETTY=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=app
      - DB_MIGRATE_ON_START=true
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - PDF_API_URL=http://flaky-pdf:4000
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: pdf_worker_consumer
    restart: unless-stopped
    command: npm run dev:worker
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - WORKER_HTTP_PORT=3001
      - LOG_LEVEL=info
      - LOG_PRETTY=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=app
      - DB_MIGRATE_ON_START=true
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - PDF_API_URL=http://flaky-pdf:4000
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
